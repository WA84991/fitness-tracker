<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="健身记录 - 记录训练组数与动作的个人健身应用">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>健身记录</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-header">
    <h1 id="page-title">健身记录</h1>
    <div id="header-actions"></div>
  </header>

  <main id="app"></main>

  <nav id="tabbar">
    <a href="#/today" data-tab="today"><span class="tab-icon">📋</span><span>今天</span></a>
    <a href="#/history" data-tab="history"><span class="tab-icon">📅</span><span>记录</span></a>
    <a href="#/charts" data-tab="charts"><span class="tab-icon">📈</span><span>图表</span></a>
    <a href="#/plans" data-tab="plans"><span class="tab-icon">🗓️</span><span>计划</span></a>
    <a href="#/settings" data-tab="settings"><span class="tab-icon">⚙️</span><span>设置</span></a>
  </nav>

  <div id="update-banner" hidden>
    <span>发现新版本</span>
    <button id="update-now">立即刷新</button>
    <button id="update-close" aria-label="关闭">✕</button>
  </div>

  <div id="toast" hidden></div>

  <div id="modal-root"></div>

  <div id="timer-fab" hidden>
    <span id="timer-fab-text"></span>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
